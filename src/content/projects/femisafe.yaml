room:
  headline: "Safety,"
  accent: "within reach."
  text: >-
    For class, errands and the ride home. One calm app for SOS, journey check-ins, live location by
    text and a polite way out, built independently for Android.
  points: [No account needed, Works offline, Encrypted notes, Light and dark]
  media:
    - { src: ../../assets/projects/femisafe/store/femisafe-02-sos.png, alt: "Press and hold for SOS: three seconds and a short countdown, so it never starts by accident.", kind: phone }
    - { src: ../../assets/projects/femisafe/store/femisafe-03-alert-status.png, alt: "See who your alert reached: sent and delivered, as your phone reports it. 911 is one tap away.", kind: phone }
    - { src: ../../assets/projects/femisafe/store/femisafe-04-safety-journey.png, alt: "Check in on the way home: set a destination and a check-in time, tap I'm OK whenever you like.", kind: phone }
