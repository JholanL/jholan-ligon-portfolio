      - { src: ../../assets/projects/femisafe/store/femisafe-06-fake-call.png, title: "A polite way out", alt: "A polite way out: a realistic scheduled call.", kind: phone }
      - { src: ../../assets/projects/femisafe/store/femisafe-07-private-by-default.png, title: "Private by default", alt: "Private by default: no account needed, works offline, encrypted notes, light and dark.", kind: phone }
