room:
  headline: "From Workshop"
  accent: "to Workflow."
  text: >-
    Custom furniture moves through six workshop stages, three kinds of users and a lot of
    materials. TopCraft gives the owner, the client and the worker one shared record of every piece.
  points:
    - "Owner · web: projects, scheduling, inventory and QC approvals"
    - "Client · Android: browse, request custom pieces, follow each order"
    - "Worker · Android: today's tasks, stage updates and QC photos"
  media:
    - src: ../../assets/projects/topcraft/web/01-introduction.webp
      alt: "TopCraft introduction panel: 'From Workshop to Workflow', the owner schedule overview with AI recommendations on a laptop, and the client AI assistant on a phone."
    - src: ../../assets/projects/topcraft/mobile/05-production-updates.webp
      alt: "TopCraft mobile panel 'Progress at Every Stage': the client order timeline and the worker's current-stage update screen."
      kind: phone
sections:
  - type: brief
    problem: >-
      A made-to-order furniture shop has a lot of moving parts. Every order becomes a piece that
      passes through six workshop stages. Workers and materials have to be assigned, and quality
      has to be checked before anything ships. TopCraft keeps all of it in one place.
    people:
      - { name: Owner, text: "Runs the business from the web: projects, scheduling, materials, scraps, QC approvals and reports." }
      - { name: Client, text: "Browses the catalog on Android, requests a custom piece and follows the order stage by stage." }
      - { name: Worker, text: "Sees today's focus on Android, updates the current stage and submits QC photos and notes." }
    product: >-
      A web platform for the owner and an Android app for clients and workers. All three connect
      to the same project, so a stage update on the shop floor appears on the client's timeline
      and on the owner's dashboard.
  - type: pipeline
    title: Every piece, six stages.
    intro: >-
      Each order becomes a project with its own stage pipeline, assigned craftsmen and a deadline
      window. Each completed stage moves the piece about 17% closer to done.
    stages:
      - { name: Material Preparation, note: Lumber and stock pulled for the piece }
      - { name: Cutting }
      - { name: Assembly }
      - { name: Sanding }
      - { name: Finishing }
      - { name: Final Inspection, note: Owner approves or returns rework notes }
    media:
      src: ../../assets/projects/topcraft/web/06-production-management.webp
      alt: "Project details for a Narra Dining Table: order details on the left and the production pipeline at 50%, stage 3 of 6, on the right."
      caption: "Project details: order data beside the live stage pipeline."
  - type: roles
    title: Three roles, one record.
    intro: The same Narra Dining Table, seen by each person who touches it.
    roles:
      - name: Owner
        surface: Web platform
        text: Manages the project, assigns workers and reviews each QC round.
        points: [Dashboard with live counts and a deadline watchlist, Production timeline across every active project, "Owner-only internal notes, hidden from workers and clients"]
        media:
          src: ../../assets/projects/topcraft/original-captures/web/project-details.png
          alt: "Owner web view of a project: client, delivery address, internal notes and the stage pipeline."
      - name: Client
        surface: Android app
        text: Follows the order from placement to delivery.
        points: [Order journey with step-by-step progress, "Timeline, specs and payment tabs", Message about this order]
        media:
          src: ../../assets/projects/topcraft/original-captures/mobile/client-order-overview.png
          alt: "Client app order screen: In Production, step 2 of 6, with the next step Quality Checking."
          kind: screen
      - name: Worker
        surface: Android app
        text: Updates the current stage from the shop floor.
        points: [Today's focus and shop-floor list, Mark a stage done or partially done, Attach photos and a worker note]
        media:
          src: ../../assets/projects/topcraft/original-captures/mobile/worker-stage-update.png
          alt: "Worker app stage update screen with photo upload, worker note and Mark stage done."
          kind: screen
  - type: features
    title: Inside the owner's workshop.
    intro: "Captures and campaign panels from the running web platform."
    items:
      - eyebrow: Owner dashboard
        title: Your operations, one clear view.
        body: Projects, approvals, deliveries and stock are summarised the moment the owner signs in.
        points: [Live counts for active projects, QC and low stock, Deadline watchlist with on-track and at-risk status, "Revenue trend across 7, 30 or 90 days"]
        media:
          src: ../../assets/projects/topcraft/original-captures/web/owner-dashboard.png
          alt: "Owner dashboard: greeting banner, six live counters, the projects watchlist and a revenue trend chart."
      - eyebrow: Production scheduling
        title: Plan smarter. Stay on track.
        body: >-
          A shared timeline of every active project shows risk status, assigned workers and stage bars
          against the deadline, with an AI insights panel beside it.
        media:
          src: ../../assets/projects/topcraft/original-captures/web/production-schedule.png
          alt: "Production timeline: a Gantt-style view with colour-coded stages for each active furniture project."
      - eyebrow: Inventory and materials
        title: Make every material count.
        body: >-
          Raw stock is tracked against reorder points, with procurement, goods receipts and stock logs.
          Reusable offcuts go into a scrap registry, graded by quality and linked to the project they
          came from.
        points: ["Healthy, low and out-of-stock at a glance", "Procurement, goods receipts and stock logs", Scrap registry graded by quality and status]
        media:
          src: ../../assets/projects/topcraft/original-captures/web/inventory-materials.png
          alt: "Raw materials inventory: stock levels with healthy, low and out-of-stock status."
      - eyebrow: Quality control
        title: Inspected before it ships.
        body: >-
          Workers submit stage photos and notes from the floor. The owner reviews each QC round, then
          approves the piece for delivery or sends it back for rework.
        media:
          src: ../../assets/projects/topcraft/original-captures/web/qc-inspection.png
          alt: "Owner QC inspection: the worker's stage photos and notes, with approve and rework actions."
      - eyebrow: Connected workflows
        title: One system. Multiple roles.
        body: The client follows the order timeline, the owner manages the same project, and the worker updates the current stage.
        media:
          src: ../../assets/projects/topcraft/web/07-connected-workflows.webp
          alt: "Connected workflows panel: the same Narra Dining Table project on the client phone, the owner laptop and the worker phone."
  - type: features
    title: The AI layer.
    intro: >-
      Four AI-assisted features run on the same project data. Every saved AI response from the
      running app is tagged as generated by Google Gemini.
    items:
      - eyebrow: AI multi-view visualization
        title: See it before it's built.
        body: >-
          Clients describe a custom piece (type, wood, finish, room, style and shape) and generate an
          AI concept sheet that shows it from four angles. The sheet is marked as a conceptual
          reference only, not a technical drawing; final designs are reviewed and approved by the
          workshop.
        points: [Every generation kept in a history, Pick up to three concepts to submit with the request, Regenerate with extra instructions]
        media:
          src: ../../assets/projects/topcraft/web/02-ai-product-visualization.webp
          alt: "AI multi-view visualization panel: the client custom-order form on a phone beside an AI concept sheet of a shelf shown from four angles."
      - eyebrow: Scrap material optimization
        title: Turn offcuts into ideas.
        body: >-
          Every reusable offcut is logged with its size, grade and origin. AI then suggests small
          products the shop could build from the pieces on hand.
        points: [Each idea names the exact scrap pieces it uses, "Dimensions, tools and step-by-step build notes", Every generated batch is kept in history]
        media:
          src: ../../assets/projects/topcraft/web/03-ai-scrap-optimization.webp
          alt: "AI scrap suggestions panel: the scrap registry beside an AI creation suggestion for a small plant stand with materials, tools and build steps."
      - eyebrow: AI production insights
        title: Plan smarter. Stay on track.
        body: >-
          AI reads the live production schedule and flags the projects that need attention (overdue
          work, staffing gaps and deadline pressure) with a recommended action for each.
        media:
          src: ../../assets/projects/topcraft/web/04-ai-production-insights.webp
          alt: "AI production insights panel: the AI overview of projects needing attention above the production timeline."
      - eyebrow: AI for clients and workers
        title: Intelligence behind the workflow.
        body: >-
          For clients, an AI assistant answers questions about products, orders, custom requests and
          delivery using the client's own records. For workers, an AI daily schedule builds a day
          plan of work blocks and breaks from assigned projects, deadlines and progress.
        media:
          src: ../../assets/projects/topcraft/web/05-ai-assistance.webp
          alt: "AI assistance panel: the client AI assistant answering an order question, and the worker's AI-generated daily schedule."
  - type: gallery
    title: The Android app.
    intro: The App Store-style campaign for the client and worker experience, including the AI features.
    style: phones
    items:
      - { src: ../../assets/projects/topcraft/mobile/01-mobile-introduction.webp, alt: "TopCraft Mobile: the client shop home with the AI Studio card, categories and featured products.", title: "Your projects, wherever you are.", kind: phone }
      - { src: ../../assets/projects/topcraft/mobile/02-ai-concept.webp, alt: "Custom order form and the AI concept sheet of the requested piece.", title: "See it before it's built.", kind: phone }
      - { src: ../../assets/projects/topcraft/mobile/03-ai-assistant.webp, alt: "Client AI assistant answering a question about an order's stage and completion date.", title: "Ask about any order.", kind: phone }
      - { src: ../../assets/projects/topcraft/mobile/04-ai-work-schedule.webp, alt: "Worker AI daily schedule with work blocks, breaks and the first-priority project.", title: "Your day, planned.", kind: phone }
      - { src: ../../assets/projects/topcraft/mobile/05-production-updates.webp, alt: "Order timeline and the worker's current-stage update screen.", title: "Progress at every stage.", kind: phone }
