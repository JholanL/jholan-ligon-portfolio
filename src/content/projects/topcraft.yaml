          - { src: ../../assets/projects/topcraft/original-captures/mobile/ai-worker-daily-schedule.png, alt: "Worker AI daily schedule.", caption: Worker · AI schedule, kind: screen }
  - type: contribution
    title: My part, and the team's.
    mine:
      - Project manager for the four-member capstone team
      - Analyzed the client's requirements and coordinated development of the web and mobile system
      - Developed application features and UI components
      - Performed functional testing and resolved issues
    team:
      - A four-member capstone team building for Industrial Manila Furniture, 2025–2026
  - type: decisions
    title: Decisions you can see in the product.
    items:
      - { title: "Each role works on the platform that fits it.", body: "The owner gets the dense web dashboard. Clients and workers get a focused Android app built around their part of the order." }
      - { title: Owner-only notes., body: "Internal notes on a project are visible to the owner only. Workers and clients never see them." }
      - { title: Nothing ships unreviewed., body: "A final inspection waits for owner approval. Rejected work goes back to the worker with rework notes." }
      - { title: "Offcuts are inventory, not waste.", body: "Scrap pieces are logged with dimensions, grade and the project they came from, so reusable material can be reserved again." }
      - { title: AI output is a starting point., body: "AI concept sheets are labelled as a conceptual reference, not a technical drawing, and final designs are reviewed and approved by the workshop." }
