          - { src: ../../assets/projects/topcraft/original-captures/web/production-schedule.png, alt: "Production timeline with stage bars and the AI insights panel.", caption: Production timeline }
          - { src: ../../assets/projects/topcraft/original-captures/web/project-details.png, alt: "Project details with the stage pipeline.", caption: Project details }
          - { src: ../../assets/projects/topcraft/original-captures/web/inventory-materials.png, alt: "Raw materials inventory table.", caption: Materials inventory }
          - { src: ../../assets/projects/topcraft/original-captures/web/scrap-registry.png, alt: "Scrap registry with grades, origins and AI creation suggestions button.", caption: Scrap registry }
          - { src: ../../assets/projects/topcraft/original-captures/web/qc-inspection.png, alt: "QC inspection review with worker photos.", caption: QC inspection }
          - { src: ../../assets/projects/topcraft/original-captures/web/ai-production-insights-overview.png, alt: "AI overview of projects needing attention, with recommended actions.", caption: AI production insights }
          - { src: ../../assets/projects/topcraft/original-captures/web/ai-scrap-creation-suggestions.png, alt: "AI creation suggestions generated from logged scrap pieces.", caption: AI scrap suggestions }
          - { src: ../../assets/projects/topcraft/original-captures/web/ai-client-assistant-web.png, alt: "Client AI assistant on the web.", caption: AI assistant · web }
      - label: Android app
        style: phones
        items:
          - { src: ../../assets/projects/topcraft/original-captures/mobile/client-shop-home.png, alt: "Client shop home.", caption: Client · Shop, kind: screen }
          - { src: ../../assets/projects/topcraft/original-captures/mobile/client-custom-order-request.png, alt: "Client custom order request form.", caption: Client · Custom order, kind: screen }
