place: The Workshop
tagline: From workshop to workflow.
summary: >-
  An AI-assisted furniture manufacturing management system for Industrial Manila Furniture. The owner runs
  production from a web platform; clients and workers use an Android app. All three work on the
  same project record.
kind: Client-based capstone
team: Team of four
role: Project manager
year: 2025–2026
platforms: [Web platform, Android app]
stackShort: []
