      - { src: ../../assets/projects/voicelink/showcase/02-learning.png, title: "Learning that moves you forward.", caption: "Courses unlock lesson by lesson.", alt: "My Courses catalog with per-course progress, and a learning path where lessons 1 and 2 are done, lesson 3 is up next and the final quiz is locked." }
      - { src: ../../assets/projects/voicelink/showcase/03-assessments.png, title: "Turn learning into progress.", caption: "Server-timed, server-graded quizzes with autosave, and verifiable certificates.", alt: "A quiz in progress with the server timer and 'all answers saved', the graded result at 100% passed, and a certificate card with a verification code." }
      - { src: ../../assets/projects/voicelink/showcase/04-call-simulation.png, title: "Practice beyond the classroom.", caption: "Every reply is scored by the server; partial answers earn partial credit.", alt: "Call simulator mid-call with an irate customer, server-scored replies (+8/10, and +6/10 'partly covered'), and the final 80% passed result." }
      - { src: ../../assets/projects/voicelink/showcase/05-trainer.png, title: "Manage training with clarity.", caption: "Course and quiz builders, and a progress matrix for the whole wave.", alt: "Trainer course builder with lessons and a nested final assessment, the Wave 12 progress matrix by agent and course, and the quiz builder with the correct answer marked." }
      - { src: ../../assets/projects/voicelink/showcase/06-responsive.png, title: "One workspace. Every screen.", caption: "The same app at desktop, tablet and phone widths.", alt: "The agent dashboard reflowed at a 1536 px desktop, a 768 px tablet and a 390 px phone, plus the phone's slide-out menu." }
