  - type: roles
    title: Three portals, three owners.
    intro: Each team member owned one role portal. Shared files changed only through the lead.
    roles:
      - name: Agent portal
        surface: For trainees
        text: Learn, practise and prove readiness.
        points: ["Learning paths: lesson, then its quiz, then the final quiz", "Text or push-to-talk voice calls, scored per reply", "Daily Drill drawn only from quizzes already passed", "PDF certificates with a QR code and a public verification page", "Knowledge base on Ctrl+K during calls"]
        media: { src: ../../assets/projects/voicelink/showcase/02-learning.png, alt: "My Courses catalog and a locked learning path." }
      - name: Trainer workspace
        surface: For coaches
        text: Build the curriculum and watch the wave.
        points: ["CourseBuilder with YouTube and document import", "QuizBuilder and a branching ScenarioBuilder", "6-criteria QA scorecards", "Batch progress matrix, per-course and per-question analytics", Go-live endorsements]
        media: { src: ../../assets/projects/voicelink/showcase/05-trainer.png, alt: "Trainer course builder, wave progress matrix and quiz builder." }
      - name: Admin console
        surface: For operations
        text: Decide who goes live.
