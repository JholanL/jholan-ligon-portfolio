        media: { src: ../../assets/projects/voicelink/showcase/07-analytics.png, alt: "Analytics, leaderboard, alerts and endorsements." }
  - type: architecture
    title: How it fits together.
    intro: A single-page client talks to a REST API over JSON. Role and ownership checks run on every route.
    nodes:
      - { name: React client, detail: "React 19 · React Router 7 · Vite", items: [Agent, Trainer and Admin portals, "Recharts analytics, jsPDF + QR certificates", Off-canvas menu on small screens] }
      - { name: Express REST API, detail: "Node.js · Express 4", items: ["JWT bearer tokens with server-side revocation", "Role and ownership checks on every route", "Helmet, rate limits, input validation and sanitising"] }
      - { name: MongoDB, detail: "Mongoose 9", items: ["Users, courses, quizzes, attempts, progress", "Simulation sessions, evaluations, certificates", "Audit log, notifications, endorsements"] }
    links: ["REST · JSON · Bearer JWT", "Mongoose models · unique indexes"]
  - type: decisions
    title: Engineering decisions.
    intro: These are team decisions, and they are documented in the project.
    items:
      - { title: The server owns every score., body: "Quizzes and simulator calls run as server sessions. The server keeps the deadline, does the grading, and applies compare-and-set updates with unique indexes, so the client can't forge a score and concurrent requests can't double-count." }
      - { title: "Rate limits per account, not per IP.", body: "A whole training room often shares one office IP. Keying limits to the account means one busy room doesn't lock everyone out." }
      - { title: Archive instead of delete., body: "Content that has learner history is archived, not deleted, and certificates keep snapshots, so past records stay valid." }
      - { title: Revocable tokens., body: "JWTs carry a token version, so the server can revoke sessions without waiting for them to expire." }
  - type: engineering
    title: Tested against a real database.
    intro: "Suites run against an isolated real MongoDB, alongside unit tests on the Node.js test runner."
    stats:
      - { value: "171", label: Unit tests }
      - { value: "236", label: API tests }
      - { value: "32", label: Concurrency and index checks }
      - { value: "17", label: Rate-limit checks }
    note: "Counts are from the last full run on 28 October 2026."
  - type: note
    title: About the AI features
    body: >-
      Optional Google Gemini features are implemented. They draft quiz questions from lesson text,
      format imported lessons, and act as a fallback matcher when the offline simulator matcher can't
      decide. They only run when an API key is configured. The walkthrough and panels were recorded
      without a key, so every score shown comes from the server's built-in matching.
  - type: contribution
    title: My part, and the team's.
    mine:
      - Server dependency configuration and testing
      - Database connection safeguards
      - Authentication-related workflows
      - Application testing
    team:
      - "Three role owners: one each for the Agent, Trainer and Admin portals"
      - "Branch flow: main ← dev ← feature/trainer, feature/admin, feature/agent"
      - The development work across the app is the team's, not one person's
  - type: stack
    groups:
      - { name: Frontend, items: [React 19, React Router 7, React-Bootstrap 2, Bootstrap 5, Vite, Axios, Recharts, jsPDF, qrcode, pdf.js, Tesseract.js, JSZip] }
      - { name: Backend, items: [Node.js, Express 4, MongoDB, Mongoose 9, jsonwebtoken, bcryptjs, express-validator, Helmet, express-rate-limit, express-mongo-sanitize] }
      - { name: Quality, items: [Node.js test runner, oxlint] }
      - { name: Optional, items: [Google Gemini API] }
