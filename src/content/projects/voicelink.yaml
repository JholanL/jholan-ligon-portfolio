sections:
  - type: film
    title: Watch the real app.
    intro: "A 1:50 narrated walkthrough built from continuous browser recordings of the running app. Jump to any portal."
  - type: brief
    problem: >-
      New-hire agents need structured product and soft-skills training, realistic call practice and
      measurable readiness before they take live customers. Trainers need to build that curriculum
      and see who is falling behind. Administrators need oversight of training waves, certification
      and go-live decisions.
    people:
      - { name: Agents, text: "New-hire call-center trainees working through a wave." }
      - { name: Trainers, text: "Build content, evaluate calls and coach their wave." }
      - { name: Administrators, text: "Run users, batches, certificates and production go-live." }
    product: >-
      A single-page React app with Agent, Trainer and Admin portals over an Express and MongoDB REST
      API. The setting is fictional: VoiceLink Solutions training agents for its Lumina Telecom
      account. Every name and record on screen is demo data.
