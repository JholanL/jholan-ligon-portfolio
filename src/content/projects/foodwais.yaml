room:
  headline: "Lahat ’yan,"
  accent: "masisira."
  text: >-
    “All of that will spoil.” Fish and meat cost more every month, and it hurts to waste them.
    FoodWais is a hackathon prototype that checks freshness, plans the pantry and helps you haggle,
    with the AI designed to run on the phone.
  points: [Freshness check, Pantry tracking, Price comparison]
  media:
    - src: ../../assets/projects/foodwais/showcase.png
      alt: "FoodWais hackathon showcase by CocoJJAM: the freshness scanner on a fish, a freshness result, the pantry list and a stall price comparison."
      kind: phone
sections:
  - type: quote
    quote: "Lahat ’yan, masisira."
    translation: "All of that will spoil."
    attribution: "The opening line of the FoodWais film: fish and meat are expensive, and it's a waste when they spoil in the fridge."
  - type: brief
    problem: >-
      Prices for fish and meat keep rising, and food that spoils in the fridge is money lost. At the
      palengke it's hard to know whether a cut is fresh, or whether the vendor's price is fair.
    people:
      - { name: Home cooks, text: "Deciding what to cook before something spoils." }
      - { name: Market shoppers, text: "Choosing a stall and a fair price at the wet market." }
    product: >-
      A mobile prototype with a freshness scanner, a pantry with recipes and a shopping list, real
      Metro Manila price data, and a Palengke Mode for checking and comparing vendors' prices.
  - type: storyboard
    title: The idea, in eight frames.
    intro: Real frames from the FoodWais film. Select one to play the film from that moment.
    frames:
      - { t: 0, title: The problem, body: "Fish and meat are expensive, and it's a waste when they spoil in the fridge.", media: { src: ../../assets/projects/foodwais/stills/01-problem.jpg, alt: "Film frame: 'Lahat 'yan, masisira.' surrounded by fish and meat prices." } }
      - { t: 9, title: "Point. Snap. Alamin.", body: "Snap a photo of the meat or fish. A local AI model on the phone does the check.", media: { src: ../../assets/projects/foodwais/stills/02-scan.jpg, alt: "Film frame: the freshness scanner camera framing a fish." } }
      - { t: 14, title: Fresh., body: "A freshness result, plus an estimate of how soon to cook it. It's a visual estimate, not a food-safety check.", media: { src: ../../assets/projects/foodwais/stills/03-fresh.jpg, alt: "Film frame: a 'Fresh' result card for the fish." } }
      - { t: 21, title: Cook it before it spoils., body: "Added to the pantry with a recipe and a list of missing ingredients.", media: { src: ../../assets/projects/foodwais/stills/04-recipe.jpg, alt: "Film frame: Sinigang na Bangus recipe with a seven-item shopping list." } }
      - { t: 26, title: Real prices., body: "NCR monthly averages from PSA data, via WFP Philippines Food Prices on HDX (CC BY-IGO).", media: { src: ../../assets/projects/foodwais/stills/05-prices.jpg, alt: "Film frame: bangus usual price range this month, ₱245 to ₱285." } }
      - { t: 35, title: Try to haggle., body: "In Palengke Mode, type the vendor's price. ₱300 is above the usual range, so aim for ₱285 or less.", media: { src: ../../assets/projects/foodwais/stills/06-haggle.jpg, alt: "Film frame: 'Try to haggle' card, ₱15 above the usual range, looks fresh." } }
      - { t: 44, title: Compare stalls., body: "Freshness first, then price. Stall 1 is just as fresh and ₱20 a kilo cheaper.", media: { src: ../../assets/projects/foodwais/stills/07-compare.jpg, alt: "Film frame: Buy at Stall 1 recommendation with three stalls compared." } }
      - { t: 52, title: Local AI., body: "Photos stay on the phone, the freshness AI runs on the phone, and there's no sign-in.", media: { src: ../../assets/projects/foodwais/stills/08-local-ai.jpg, alt: "Film frame: 'Local AI. On your phone. Photos stay on your phone.'" } }
  - type: film
    title: The film.
    intro: "One minute, in Taglish, from the fridge to the palengke."
  - type: decisions
    title: What the prototype gets right.
    items:
      - { title: "An estimate, labelled as one.", body: "The result card says it's a visual estimate on your phone, not a food-safety check." }
      - { title: Private by design., body: "Photos stay on the phone, the freshness model is designed to run on-device, and there's no sign-in." }
      - { title: "Freshness first, then price.", body: "Stall comparisons rank freshness first, so the cheapest stall doesn't win by default." }
      - { title: Grounded in real data., body: "Usual price ranges come from published Metro Manila retail averages, not guesses." }
      - { title: Speaks like the market., body: "Taglish copy that sounds like a real palengke trip: 'Pwede po bang ₱285 na lang?'" }
  - type: contribution
    title: My part, and the team's.
    mine:
      - Worked with the fish, pork, chicken and beef image datasets used for freshness classification
      - Helped design the app's workflow
    team:
      - Team CocoJJAM built the prototype at the AppBuildersPH Hackathon, October 9–10, 2026
  - type: note
    title: Status
    body: >-
      FoodWais is a hackathon prototype by team CocoJJAM for the AppBuildersPH Hackathon. The screens in
      the film and the showcase are labelled “FoodWais design screens · example result”.
